<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dragon Farm Idle</title>
  <link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <header class="topbar">
    <div class="title">Dragon Farm Idle</div>
    <div class="coins"><span id="coins">0</span></div>
    <div class="cps"><span id="cps">0</span> coins/sec</div>
    <div class="render-goal">
      <div class="bar"><div class="fill" id="render-fill"></div></div>
      <div class="render-row">
        <span class="muted" id="render-text"></span>
        <button id="render-btn" class="render-btn" disabled>Render</button>
      </div>
    </div>
  </header>

  <main class="panels">
    <section class="panel active" id="panel-slimes">
      <h2>Slimes</h2>
      <div id="tiers" class="tiers"></div>
    </section>

    <section class="panel" id="panel-upgrades">
      <h2>Upgrades</h2>
      <div id="upgrades" class="upgrades"></div>
    </section>

    <section class="panel" id="panel-settings">
      <h2>Settings</h2>
      <button id="reset" class="reset-btn">Reset save</button>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab active" data-panel="panel-slimes">Slimes</button>
    <button class="tab" data-panel="panel-upgrades">Upgrades</button>
    <button class="tab" data-panel="panel-settings">Settings</button>
  </nav>

  <script src="lib/break_eternity.js?v=11"></script>
  <script src="main.js?v=11"></script>
</body>
</html>
