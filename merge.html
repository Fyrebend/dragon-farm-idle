<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slime Merge (Prototype)</title>
<style>
  :root { --bg:#15191e; --card:#1f252c; --card-2:#2a323b; --text:#e6e9ec; --dim:#8b96a1; --good:#5fd38d; --gold:#f0c45a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 720px; margin: 0 auto; padding: 12px; }
  header { position: sticky; top:0; background:var(--bg); padding:8px 0; z-index:2; border-bottom:1px solid var(--card-2); }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .slime { font-size:1.6rem; font-weight:700; color:var(--good); }
  .rate, .dim { color:var(--dim); font-size:.85rem; }
  a { color:var(--gold); }
  h2 { font-size:1rem; margin:16px 0 8px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  button { background:var(--card-2); color:var(--text); border:1px solid #3a444f; border-radius:8px; padding:10px 12px; font-size:.95rem; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  button.main { background:#2d6a48; border-color:#3f8a60; font-weight:600; }
  .pen { display:grid; grid-template-columns: repeat(auto-fill, minmax(78px,1fr)); gap:6px; }
  .slot { height:78px; border-radius:10px; background:var(--card); border:1px dashed var(--card-2); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:.72rem; text-align:center; padding:4px; cursor:pointer; user-select:none; }
  .slot.full { border-style:solid; }
  .slot .blob { width:30px; height:24px; border-radius:50% 50% 45% 45%; margin-bottom:4px; box-shadow: inset -4px -4px 0 rgba(0,0,0,.25); }
  .slot .tn { font-weight:700; font-size:.68rem; color:var(--dim); }
  .slot.ready { animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { from { box-shadow:0 0 0 rgba(240,196,90,0); } to { box-shadow:0 0 10px rgba(240,196,90,.8); } }
  .slot.empty { color:var(--dim); font-size:1.4rem; }
  .ups { display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap:8px; }
  .up { background:var(--card); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:6px; }
  .up b { font-size:.95rem; } .up .dim { font-size:.78rem; }
  .tiers { font-size:.82rem; display:grid; grid-template-columns: auto 1fr auto auto; gap:2px 10px; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#3a2f12; color:var(--gold); border:1px solid var(--gold); padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast.show { opacity:1; }
  label[hidden] { display:none; }
  label { font-size:.85rem; color:var(--dim); display:flex; align-items:center; gap:4px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="top">
      <div><span class="slime" id="slime">0</span> <span class="dim">slime</span></div>
      <div class="rate"><span id="rate">0</span>/s · <span id="mult"></span></div>
    </div>
    <div class="dim"><a href="index.html">back to the game</a> · <span id="ver"></span></div>
  </header>

  <h2>Pen <span id="pen-count"></span></h2>
  <div class="row" style="margin-bottom:8px">
    <button class="main" id="buy">Hatch</button>
    <button id="merge-all">Merge all</button>
    <label id="auto-wrap" hidden><input type="checkbox" id="auto-on" checked> Auto-Merge</label>
    <label id="autobuy-wrap" hidden><input type="checkbox" id="autobuy-on" checked> Auto-Buy</label>
  </div>
  <div class="dim" style="margin-bottom:8px">Tap a glowing slime to merge 3 of that tier into 1 of the next. Tap an empty space to hatch.</div>
  <div class="pen" id="pen"></div>

  <h2>Upgrades</h2>
  <div class="ups" id="ups"></div>

  <h2>Tiers discovered</h2>
  <div class="tiers" id="tiers"></div>

  <h2>Prototype</h2>
  <div class="row"><button id="reset">Restart prototype</button></div>
  <p class="dim">Goal for this test: discover the Slime Dragon (Tier 20). Each new tier discovered gives +10% to all slime.</p>
</main>
<div class="toast" id="toast"></div>

<script src="merge-core.js?v=213"></script>
<script>
// ----- Save and load -----
const SAVE_KEY = "dragonFarmIdle_mergeproto";
const PROTO_VERSION = "Merge prototype v1";
let s = load();
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw), base = newMergeState();
      const st = Object.assign(base, d); st.up = Object.assign(newMergeState().up, d.up || {});
      const away = Math.min((Date.now() - (d.savedAt || Date.now())) / 1000, 8 * 3600);
      for (let t = 0; t < away; t += 10) stepMerge(st, Math.min(10, away - t));   // offline progress, up to 8 hours
      return st;
    }
  } catch (e) {}
  return newMergeState();
}
function save() { try { s.savedAt = Date.now(); localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} }

// ----- Number format -----
function fmt(n) {
  if (n < 1000) return n < 10 ? n.toFixed(1) : Math.floor(n).toString();
  const units = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No"];
  const e = Math.floor(Math.log10(n) / 3);
  if (e < units.length) return (n / Math.pow(1000, e)).toFixed(2) + units[e];
  return n.toExponential(2).replace("+", "");
}
function color(i) { return `hsl(${(120 + i * 47) % 360} 65% 55%)`; }

// ----- Toast -----
let toastTimer;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); }
function checkDiscover() { if (s.lastDiscover != null) { toast("New tier discovered: " + tierName(s.lastDiscover) + "! +10% slime"); s.lastDiscover = null; } }

// ----- Actions -----
document.getElementById("buy").onclick = () => { buy(s); checkDiscover(); render(); };
document.getElementById("merge-all").onclick = () => { mergeAll(s); checkDiscover(); render(); };
document.getElementById("auto-on").onchange = e => { s.autoOn = e.target.checked; };
document.getElementById("autobuy-on").onchange = e => { s.autobuyOn = e.target.checked; };
document.getElementById("reset").onclick = () => { if (confirm("Restart the merge prototype from scratch?")) { s = newMergeState(); save(); render(); } };
document.getElementById("pen").onclick = e => {
  const slot = e.target.closest(".slot"); if (!slot) return;
  if (slot.dataset.tier === undefined) buy(s); else merge(s, +slot.dataset.tier);
  checkDiscover(); render();
};
document.getElementById("ups").onclick = e => { const b = e.target.closest("button[data-up]"); if (b) { upgrade(s, b.dataset.up); render(); } };

// ----- Drawing -----
let penKey = "";
function render() {
  document.getElementById("slime").textContent = fmt(s.slime);
  document.getElementById("rate").textContent = fmt(slimePerSec(s));
  document.getElementById("mult").textContent = "×" + fmt(prodMult(s)) + " all slime";
  document.getElementById("ver").textContent = PROTO_VERSION;

  const buyBtn = document.getElementById("buy");
  buyBtn.textContent = `Hatch a ${tierName(s.up.hatch)} (${fmt(buyCost(s))})`;
  buyBtn.disabled = !canBuy(s);
  document.getElementById("merge-all").disabled = !s.units.some((n, i) => canMerge(s, i));
  document.getElementById("auto-wrap").hidden = !s.up.auto;
  document.getElementById("autobuy-wrap").hidden = !s.up.autobuy;
  document.getElementById("auto-on").checked = s.autoOn;
  document.getElementById("autobuy-on").checked = s.autobuyOn;
  document.getElementById("pen-count").textContent = `(${unitCount(s)}/${penSize(s)})`;

  // pen: highest tiers first; only redraw when something changed
  const cells = [];
  for (let i = s.units.length - 1; i >= 0; i--) for (let k = 0; k < s.units[i]; k++) cells.push(i);
  const affordable = canBuy(s);
  const key = cells.join(",") + "|" + penSize(s) + "|" + affordable;
  if (key !== penKey) {
    penKey = key;
    let html = cells.map(i => `<div class="slot full${canMerge(s, i) ? " ready" : ""}" data-tier="${i}" title="${fmt(tierRate(s, i))}/s">
      <div class="blob" style="background:${color(i)}"></div><div>${tierName(i)}</div><div class="tn">T${i + 1}</div></div>`).join("");
    for (let k = cells.length; k < penSize(s); k++) html += `<div class="slot empty" style="${affordable ? "" : "opacity:.5"}">+</div>`;
    document.getElementById("pen").innerHTML = html;
  }

  // upgrades
  const ups = Object.keys(MERGE.upgrades).map(id => {
    const u = MERGE.upgrades[id], lv = s.up[id], maxed = lv >= u.max;
    const lvText = u.max > 1 ? ` (Lv ${lv})` : (lv ? " (owned)" : "");
    return `<div class="up"><b>${u.name}${lvText}</b><span class="dim">${u.desc}</span>
      <button data-up="${id}" ${maxed || !canUpgrade(s, id) ? "disabled" : ""}>${maxed ? "Maxed" : fmt(upCost(s, id))}</button></div>`;
  }).join("");
  const upsEl = document.getElementById("ups");
  if (upsEl.dataset.k !== ups) { upsEl.innerHTML = ups; upsEl.dataset.k = ups; }

  // tiers
  let t = "<b>Tier</b><b>Name</b><b>Owned</b><b>Each /s</b>";
  for (let i = 0; i <= s.best; i++) t += `<span>T${i + 1}</span><span style="color:${color(i)}">${tierName(i)}</span><span>${s.units[i] || 0}</span><span>${fmt(tierRate(s, i))}</span>`;
  const tEl = document.getElementById("tiers");
  if (tEl.dataset.k !== t) { tEl.innerHTML = t; tEl.dataset.k = t; }
}

// ----- Loop -----
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1); last = now;
  stepMerge(s, dt); checkDiscover(); render();
  requestAnimationFrame(frame);
}
setInterval(save, 5000);
window.addEventListener("beforeunload", save);
render(); requestAnimationFrame(frame);
</script>
</body>
</html>
